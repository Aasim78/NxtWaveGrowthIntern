<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Set up Campaign Manager</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="nav">
        <div class="brand">
          <span class="mark">M</span>Build60 Campaign Manager
        </div>
      </header>
      <section class="card center">
        <div class="eyebrow">First-time setup</div>
        <h1 style="font-size: 28px">Create the manager account</h1>
        <p class="sub">
          Choose a username and a password with at least 12 characters. This
          account can view registration details and create referral links.
        </p>
        <form id="setupForm">
          <div class="field">
            <label for="username">Username</label
            ><input
              id="username"
              minlength="3"
              maxlength="80"
              autocomplete="username"
              required
            />
          </div>
          <div class="field">
            <label for="password">Password</label
            ><input
              id="password"
              type="password"
              minlength="12"
              autocomplete="new-password"
              required
            />
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label
            ><input
              id="confirm"
              type="password"
              minlength="12"
              autocomplete="new-password"
              required
            />
          </div>
          <button class="btn" type="submit">Create manager account</button>
          <div id="message" class="message"></div>
        </form>
      </section>
    </main>
    <script>
      async function req(url, b) {
        let r = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(b),
          }),
          d = await r.json();
        if (!r.ok) throw Error(d.error || "Setup failed");
        return d;
      }
      document.getElementById("setupForm").onsubmit = async (e) => {
        e.preventDefault();
        let m = document.getElementById("message"),
          p = document.getElementById("password").value;
        if (p !== document.getElementById("confirm").value) {
          m.textContent = "Passwords do not match.";
          m.className = "message";
          return;
        }
        try {
          await req("/api/setup", {
            username: document.getElementById("username").value,
            password: p,
          });
          location.href = "/manager";
        } catch (x) {
          m.textContent = x.message;
          m.className = "message";
        }
      };
    </script>
  </body>
</html>
